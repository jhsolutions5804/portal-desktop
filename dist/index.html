<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Diag</title></head>
<body style="margin:0;padding:24px;background:#ffcc00;font-family:sans-serif;color:#000;">
<h2 style="margin:0 0 16px;">네트워크 진단</h2>
<div id="log" style="font-size:14px;line-height:1.8;white-space:pre-wrap;word-break:break-all;"></div>
<script>
  function log(msg) {
    document.getElementById('log').textContent += msg + "\n";
  }
  function testFetch(label, url) {
    log('[' + label + '] 시작...');
    const t0 = Date.now();
    const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('10초 타임아웃')), 10000));
    return Promise.race([fetch(url, { mode: 'no-cors', cache: 'no-store' }), timeout])
      .then(() => log('[' + label + '] 성공 (' + (Date.now()-t0) + 'ms)'))
      .catch(e => log('[' + label + '] 실패: ' + (e && e.message ? e.message : e) + ' (' + (Date.now()-t0) + 'ms)'));
  }
  log('User-Agent: ' + navigator.userAgent);
  log('온라인 상태: ' + navigator.onLine);
  log('');
  testFetch('google.com', 'https://www.google.com')
    .then(() => testFetch('portal.jhsol.kr', 'https://portal.jhsol.kr'))
    .then(() => {
      log('');
      log('5초 후 실제 포털로 이동합니다...');
      setTimeout(() => { window.location.href = 'https://portal.jhsol.kr'; }, 5000);
    });
</script>
</body>
</html>
