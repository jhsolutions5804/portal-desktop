name: Build JH Portal Desktop App

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "체크하면 빌드 후 직원용 다운로드 링크(Release)까지 생성됩니다. 체크 해제 시 본인만 확인 가능한 빌드 결과만 생성됩니다."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build
        run: tauri build

      - name: Upload private build artifact (본인 확인용)
        uses: actions/upload-artifact@v4
        with:
          name: jh-portal-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Create Release for staff download (배포용)
        if: ${{ inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: JH Portal v${{ github.run_number }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Diagnostics
        run: |
          {
            echo "== env =="
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "JAVA_HOME=$JAVA_HOME"
            echo "== cmdline-tools =="
            find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 2 || echo "no cmdline-tools"
            echo "== existing ndk =="
            ls -la "$ANDROID_SDK_ROOT/ndk" || echo "no ndk dir"
          } > android-debug.log 2>&1 || true
          cat android-debug.log

      - name: Add cmdline-tools to PATH
        run: |
          CMDLINE_BIN=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 2 -type d -name bin | head -n1)
          echo "cmdline-tools bin: $CMDLINE_BIN" >> android-debug.log
          echo "$CMDLINE_BIN" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: |
          (yes | sdkmanager --licenses) >> android-debug.log 2>&1 || true
          cat android-debug.log

      - name: Install Android NDK (if needed)
        run: |
          EXISTING_NDK=$(ls -1 "$ANDROID_SDK_ROOT/ndk" 2>/dev/null | head -n1)
          if [ -n "$EXISTING_NDK" ]; then
            echo "이미 설치된 NDK 사용: $EXISTING_NDK" | tee -a android-debug.log
            echo "NDK_VERSION=$EXISTING_NDK" >> "$GITHUB_ENV"
          else
            echo "y" | sdkmanager --install "ndk;25.2.9519653" >> android-debug.log 2>&1
            echo "NDK_VERSION=25.2.9519653" >> "$GITHUB_ENV"
          fi

      - name: Set NDK env vars
        run: |
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI (local, Gradle이 node_modules에서 찾음)
        run: npm install

      - name: Init Android project
        run: npx tauri android init >> android-debug.log 2>&1

      - name: Configure release signing
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > src-tauri/gen/android/app/upload-keystore.jks
          cat > src-tauri/gen/android/keystore.properties << KSEOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          KSEOF

      - name: Build APK (release, signed)
        run: npx tauri android build --apk >> android-debug.log 2>&1

      - name: Upload private build artifact (본인 확인용)
        uses: actions/upload-artifact@v4
        with:
          name: jh-portal-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

      - name: Create Release for staff download (배포용)
        if: ${{ inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-android
          name: JH Portal Android v${{ github.run_number }}
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

      - name: Upload debug log (항상 업로드)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-log
          path: android-debug.log

      - name: Upload debug log to Release (항상, 확인용)
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-debug
          name: Android build debug log
          files: android-debug.log
